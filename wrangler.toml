compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "bmgpayroll"
database_id = "ceceeaf8-8c03-4299-9df9-9f0330b88493"

[env.production]
vars = { ENVIRONMENT = "production", JWT_SECRET = "hpIZKETmdvai3DCP0UML12Ycwob4986jgryWtkGRfxl7VHSXuQABzsFqJ5nONe", CORS_ORIGIN = "https://bmgone.com", API_VERSION = "v1" }
