<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Tracking - BMGOne Payroll</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .tracking-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            margin-top: 80px;
        }

        .header-section {
            background: var(--gradient-primary);
            color: white;
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-back:hover {
            background: white;
            color: var(--primary-blue);
        }

        .content-box {
            background: white;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #374151;
            font-size: 0.875rem;
        }

        .filter-group select,
        .filter-group input {
            padding: 0.75rem;
            border: 1.5px solid #d1d5db;
            border-radius: 5px;
            font-size: 0.875rem;
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            align-self: flex-end;
        }

        .btn-filter {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .btn-filter:hover {
            opacity: 0.9;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            font-weight: 600;
            color: #374151;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fed7aa;
            color: #92400e;
        }

        .status-approved {
            background: #d1fae5;
            color: #065f46;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .header-section {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .filter-buttons {
                width: 100%;
            }

            .filter-buttons button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="/logos/banner.png" alt="BMGOne" class="logo-img">
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="https://bmgone.com" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="btn btn-staff-login" id="logoutBtn">Logout</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Tracking Container -->
    <div class="tracking-container">
        <div class="header-section">
            <h1>📅 Leave Tracking</h1>
            <button class="btn-back" onclick="goBack()">← Back to Dashboard</button>
        </div>

        <div class="content-box">
            <h2 style="margin-top: 0;">All Leave Applications</h2>

            <div class="filters">
                <div class="filter-group">
                    <label for="statusFilter">Status</label>
                    <select id="statusFilter">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="leaveTypeFilter">Leave Type</label>
                    <select id="leaveTypeFilter">
                        <option value="">All Types</option>
                        <option value="Casual Leave">Casual Leave</option>
                        <option value="Sick Leave">Sick Leave</option>
                        <option value="Annual Leave">Annual Leave</option>
                        <option value="Maternity Leave">Maternity Leave</option>
                        <option value="Paternity Leave">Paternity Leave</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="dateRange">Date Range</label>
                    <input type="month" id="dateRange">
                </div>
                <div class="filter-group filter-buttons">
                    <button class="btn-filter" onclick="applyFilters()">🔍 Filter</button>
                    <button class="btn-filter" style="background: #6b7280;" onclick="resetFilters()">Reset</button>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Employee ID</th>
                            <th>Employee Name</th>
                            <th>Leave Type</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Days</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Applied On</th>
                        </tr>
                    </thead>
                    <tbody id="leaveTableBody">
                        <tr>
                            <td colspan="9" class="empty-state">Loading leave applications...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            API_BASE: 'https://pay.bmgone.com/api'
        };

        let token = localStorage.getItem('token');

        // Check authentication
        window.addEventListener('load', function() {
            if (!token) {
                alert('⚠️ Not authenticated. Please login first.');
                window.location.href = 'index.html';
                return;
            }

            const employee = localStorage.getItem('employee');
            if (employee) {
                try {
                    const employeeData = JSON.parse(employee);
                    if (!employeeData.role || !['admin', 'master_admin'].includes(employeeData.role)) {
                        alert('❌ Access Denied. Only admins can access this page.');
                        window.location.href = 'index.html';
                        return;
                    }
                } catch (e) {
                    alert('❌ Invalid authentication data.');
                    window.location.href = 'index.html';
                    return;
                }
            }

            loadLeaveApplications();
        });

        // Load all leave applications
        async function loadLeaveApplications() {
            try {
                const response = await fetch(`${CONFIG.API_BASE}/leave/applications`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load leave applications');

                const data = await response.json();
                const applications = data.applications || [];

                renderTable(applications);
            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('leaveTableBody').innerHTML = `
                    <tr>
                        <td colspan="9" class="empty-state">Failed to load leave applications</td>
                    </tr>
                `;
            }
        }

        // Render table with leave applications
        function renderTable(applications) {
            const tbody = document.getElementById('leaveTableBody');

            if (applications.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty-state">📭 No leave applications found</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = applications.map(app => {
                const statusClass = `status-${(app.status || 'pending').toLowerCase()}`;
                const statusBadge = `<span class="status-badge ${statusClass}">${app.status || 'Pending'}</span>`;

                return `
                    <tr>
                        <td><strong>${app.employee_id || '-'}</strong></td>
                        <td>${app.first_name || '-'} ${app.last_name || '-'}</td>
                        <td>${app.leave_type || '-'}</td>
                        <td>${app.start_date ? new Date(app.start_date).toLocaleDateString() : '-'}</td>
                        <td>${app.end_date ? new Date(app.end_date).toLocaleDateString() : '-'}</td>
                        <td><strong>${app.number_of_days || '-'}</strong></td>
                        <td>${app.reason ? app.reason.substring(0, 30) + '...' : '-'}</td>
                        <td>${statusBadge}</td>
                        <td>${app.created_at ? new Date(app.created_at).toLocaleDateString() : '-'}</td>
                    </tr>
                `;
            }).join('');
        }

        // Apply filters
        function applyFilters() {
            alert('🔧 Filtering feature coming soon!');
        }

        // Reset filters
        function resetFilters() {
            document.getElementById('statusFilter').value = '';
            document.getElementById('leaveTypeFilter').value = '';
            document.getElementById('dateRange').value = '';
            loadLeaveApplications();
        }

        // Go back to dashboard
        function goBack() {
            window.location.href = 'index.html';
        }

        // Logout button
        document.getElementById('logoutBtn')?.addEventListener('click', async function(e) {
            e.preventDefault();
            try {
                await fetch(`${CONFIG.API_BASE}/auth/logout`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
            } catch (error) {
                console.error('Logout error:', error);
            }

            localStorage.removeItem('token');
            localStorage.removeItem('employee');
            window.location.reload();
        });
    </script>
</body>
</html>
