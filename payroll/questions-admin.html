<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Questions Manager - BMG Health Compare</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#ECEFF1;min-height:100vh;padding:20px;}
.header{background:linear-gradient(120deg,#1B2631,#263238);border-radius:12px;padding:20px;margin-bottom:20px;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.header h1{font-size:28px;margin-bottom:5px;font-weight:900;}
.header p{color:rgba(255,255,255,.7);font-size:13px;}
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.btn{border:none;border-radius:8px;padding:10px 20px;font-weight:800;font-size:13px;cursor:pointer;color:#fff;background:#0D47A1;}
.btn:hover{opacity:0.9;}
.btn-add{background:#2E7D32;}
.btn-back{background:#F57C00;}
.table-wrap{background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{background:#1B2631;color:#CFD8DC;padding:12px;text-align:left;font-weight:700;border-bottom:2px solid #37474F;}
td{padding:12px;border-bottom:1px solid #E0E0E0;}
tr:hover{background:#F5F5F5;}
.question-cell{max-width:400px;color:#333;font-size:14px;}
.section-badge{display:inline-block;background:#1B2631;color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-right:8px;}
.status-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;background:#E8F5E9;color:#1B5E20;}
.status-hidden{background:#FFEBEE;color:#B71C1C;}
.providers-grid{display:grid;grid-template-columns:repeat(5,60px);gap:8px;}
.provider-cell{text-align:center;padding:6px;border-radius:4px;font-weight:700;font-size:12px;border:1px solid #E0E0E0;}
.prov-y{background:#E8F5E9;color:#1B5E20;border-color:#2E7D32;}
.prov-n{background:#FFEBEE;color:#B71C1C;border-color:#C62828;}
.prov-e{background:#FFF3E0;color:#E65100;border-color:#F9A825;}
.action-btns{display:flex;gap:6px;}
.btn-sm{padding:6px 12px;font-size:12px;border:none;border-radius:6px;cursor:pointer;font-weight:700;}
.btn-edit{background:#42A5F5;color:#fff;}
.btn-toggle{background:#FFB74D;color:#fff;}
.btn-delete{background:#EF5350;color:#fff;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;}
.modal.active{display:flex;}
.modal-content{background:#fff;border-radius:12px;padding:24px;max-width:600px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.3);}
.modal-header{font-size:20px;font-weight:900;margin-bottom:16px;color:#1B2631;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-weight:700;margin-bottom:6px;color:#1B2631;font-size:13px;}
.form-group input,
.form-group select,
.form-group textarea{width:100%;padding:10px;border:1.5px solid #E0E0E0;border-radius:6px;font-size:13px;font-family:inherit;}
.form-group textarea{resize:vertical;min-height:60px;}
.providers-form{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px;}
.provider-input{display:flex;flex-direction:column;}
.provider-input label{font-size:11px;margin-bottom:4px;color:#666;}
.provider-input select{padding:8px;font-size:12px;}
.modal-footer{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
.status-msg{padding:12px;border-radius:6px;margin-bottom:16px;font-weight:700;color:#fff;display:none;}
.status-msg.success{background:#4CAF50;display:block;}
.status-msg.error{background:#F44336;display:block;}
@media(max-width:768px){
  body{padding:10px;}
  .providers-grid{grid-template-columns:repeat(2,1fr);}
  .modal-content{max-width:95%;}
}
</style>
</head>
<body>

<div class="header">
  <h1>📋 Questions Manager</h1>
  <!--<p>Manage all 47 questions and their responses for each provider</p>-->
</div>

<div class="toolbar">
  <button class="btn btn-add" onclick="openAddModal()">➕ Add New Question</button>
  <button class="btn btn-back" onclick="goBack()">🔙 Back to Compare</button>
</div>

<div class="status-msg" id="statusMsg"></div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:300px;">Question</th>
        <th style="width:100px;">Section</th>
        <th style="width:350px;">Provider Responses (AB / ICICI / Star / Care / Tata)</th>
        <th style="width:80px;">Status</th>
        <th style="width:150px;">Actions</th>
      </tr>
    </thead>
    <tbody id="questionsTable">
      <tr><td colspan="5" style="text-align:center;padding:40px;color:#999;">Loading questions...</td></tr>
    </tbody>
  </table>
</div>

<!-- ADD/EDIT MODAL -->
<div id="questionModal" class="modal">
  <div class="modal-content">
    <div class="modal-header" id="modalTitle">Add New Question</div>

    <div class="form-group">
      <label>Question Text</label>
      <textarea id="questionLabel" placeholder="e.g., Basic Health Coverage"></textarea>
    </div>

    <div class="form-group">
      <label>Section</label>
      <select id="questionSection">
        <option value="">Select Section</option>
        <option value="tier1">TIER 1 — BASIC COVERAGE</option>
        <option value="tier2">TIER 2 — STANDARD FEATURES</option>
        <option value="tier3">TIER 3 — ADVANCED BENEFITS</option>
        <option value="tier4">TIER 4 — PREMIUM FEATURES</option>
        <option value="tier5">TIER 5 — MATERNITY & NEW BORN</option>
        <option value="tier6">TIER 6 — SPECIAL / UNIQUE</option>
      </select>
    </div>

    <div class="form-group">
      <label>Provider Responses</label>
      <div class="providers-form">
        <div class="provider-input">
          <label>AB</label>
          <select id="prov-ab">
            <option value="">Select...</option>
            <option value="Y">Yes (Y)</option>
            <option value="N">No (N)</option>
            <option value="E">Extra (E)</option>
          </select>
        </div>
        <div class="provider-input">
          <label>ICICI</label>
          <select id="prov-ic">
            <option value="">Select...</option>
            <option value="Y">Yes (Y)</option>
            <option value="N">No (N)</option>
            <option value="E">Extra (E)</option>
          </select>
        </div>
        <div class="provider-input">
          <label>Star</label>
          <select id="prov-star">
            <option value="">Select...</option>
            <option value="Y">Yes (Y)</option>
            <option value="N">No (N)</option>
            <option value="E">Extra (E)</option>
          </select>
        </div>
        <div class="provider-input">
          <label>Care</label>
          <select id="prov-care">
            <option value="">Select...</option>
            <option value="Y">Yes (Y)</option>
            <option value="N">No (N)</option>
            <option value="E">Extra (E)</option>
          </select>
        </div>
        <div class="provider-input">
          <label>Tata</label>
          <select id="prov-tata">
            <option value="">Select...</option>
            <option value="Y">Yes (Y)</option>
            <option value="N">No (N)</option>
            <option value="E">Extra (E)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn" style="background:#999;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-add" onclick="saveQuestion()">Save Question</button>
    </div>
  </div>
</div>

<script>
let questions = [];
let currentEditId = null;
const PROVIDERS = ['ab', 'ic', 'star', 'care', 'tata'];
const PROVIDER_LABELS = {ab:'AB', ic:'ICICI', star:'Star', care:'Care', tata:'Tata'};

function getAuthToken() {
  const token = localStorage.getItem('token');
  const employee = localStorage.getItem('employee');

  if (!token) {
    alert('❌ Not authenticated. Please login first.');
    window.location.href = 'index.html';
    return null;
  }

  // Check role - only admin and master_admin can access this page
  try {
    const employeeData = JSON.parse(employee);
    if (!employeeData.role || !['admin', 'master_admin'].includes(employeeData.role)) {
      alert('❌ Access Denied. Only admins can manage questions.');
      window.location.href = 'index.html';
      return null;
    }
  } catch (e) {
    alert('❌ Invalid authentication data.');
    window.location.href = 'index.html';
    return null;
  }

  return token;
}

async function loadQuestions() {
  try {
    const token = getAuthToken();
    const response = await fetch('https://pay.bmgone.com/api/comparison/questions/all', {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    questions = data.questions || [];

    renderTable();
    console.log(`✅ Loaded ${questions.length} questions`);
  } catch (error) {
    console.error('Load questions error:', error);
    showStatus('❌ Error loading questions', 'error');
  }
}

function renderTable() {
  const tbody = document.getElementById('questionsTable');

  if (questions.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:#999;">No questions yet. Click "Add New Question" to get started.</td></tr>';
    return;
  }

  tbody.innerHTML = questions.map(q => {
    const vals = q.values || {};
    return `
      <tr>
        <td class="question-cell">${q.feature_label}</td>
        <td><span class="section-badge">${q.section_id}</span></td>
        <td>
          <div class="providers-grid">
            ${PROVIDERS.map(p => {
              const val = vals[p] || '';
              const cls = val === 'Y' ? 'prov-y' : val === 'N' ? 'prov-n' : val === 'E' ? 'prov-e' : '';
              return `<div class="provider-cell ${cls}">${val || '-'}</div>`;
            }).join('')}
          </div>
        </td>
        <td>
          <span class="status-badge ${!q.is_active ? 'status-hidden' : ''}">
            ${q.is_active ? '✓ Active' : '✗ Hidden'}
          </span>
        </td>
        <td>
          <div class="action-btns">
            <button class="btn-sm btn-edit" onclick="openEditModal(${q.feature_id})">Edit</button>
            <button class="btn-sm btn-toggle" onclick="toggleQuestion(${q.feature_id}, ${q.is_active})">${q.is_active ? 'Hide' : 'Show'}</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

function openAddModal() {
  currentEditId = null;
  document.getElementById('modalTitle').textContent = 'Add New Question';
  document.getElementById('questionLabel').value = '';
  document.getElementById('questionSection').value = '';
  PROVIDERS.forEach(p => {
    document.getElementById(`prov-${p}`).value = '';
  });
  document.getElementById('questionModal').classList.add('active');
}

function openEditModal(featureId) {
  const q = questions.find(x => x.feature_id === featureId);
  if (!q) return;

  currentEditId = featureId;
  document.getElementById('modalTitle').textContent = 'Edit Question';
  document.getElementById('questionLabel').value = q.feature_label;
  document.getElementById('questionSection').value = q.section_id;

  const vals = q.values || {};
  PROVIDERS.forEach(p => {
    document.getElementById(`prov-${p}`).value = vals[p] || '';
  });

  document.getElementById('questionModal').classList.add('active');
}

function closeModal() {
  document.getElementById('questionModal').classList.remove('active');
}

async function saveQuestion() {
  const label = document.getElementById('questionLabel').value.trim();
  const section = document.getElementById('questionSection').value;

  if (!label) {
    showStatus('❌ Please enter a question', 'error');
    return;
  }

  if (!section) {
    showStatus('❌ Please select a section', 'error');
    return;
  }

  const values = {};
  PROVIDERS.forEach(p => {
    const val = document.getElementById(`prov-${p}`).value;
    if (val) values[p] = val;
  });

  try {
    const token = getAuthToken();
    const payload = {
      feature_label: label,
      section_id: section,
      values: values
    };

    if (currentEditId) {
      payload.feature_id = currentEditId;
    }

    const response = await fetch('https://pay.bmgone.com/api/comparison/questions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error || `HTTP ${response.status}`);
    }

    showStatus(`✅ Question ${currentEditId ? 'updated' : 'added'} successfully!`, 'success');
    closeModal();
    loadQuestions();
  } catch (error) {
    console.error('Save question error:', error);
    showStatus(`❌ Error: ${error.message}`, 'error');
  }
}

async function toggleQuestion(featureId, isCurrentlyActive) {
  try {
    const token = getAuthToken();
    const response = await fetch('https://pay.bmgone.com/api/comparison/questions/toggle', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        feature_id: featureId,
        is_active: !isCurrentlyActive
      })
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    showStatus(`✅ Question ${!isCurrentlyActive ? 'shown' : 'hidden'} successfully!`, 'success');
    loadQuestions();
  } catch (error) {
    console.error('Toggle question error:', error);
    showStatus('❌ Error toggling question', 'error');
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = `status-msg ${type}`;
  setTimeout(() => {
    el.className = 'status-msg';
  }, 3000);
}

function goBack() {
  window.location.href = 'compare.html';
}

window.onload = function() {
  const token = localStorage.getItem('token');
  if (!token) {
    alert('❌ Not authenticated. Please login first.');
    window.location.href = 'index.html';
    return;
  }
  loadQuestions();
};
</script>
</body>
</html>
