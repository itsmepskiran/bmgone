<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Approvals - BMGOne Payroll</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            margin-top: 80px;
        }

        .header-section {
            background: var(--gradient-primary);
            color: white;
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-section h1 {
            margin: 0;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: white;
            color: var(--primary-blue);
        }

        .content-box {
            background: white;
            border-radius: 10px;
            padding: 3rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .content-box h2 {
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .content-box p {
            color: #9ca3af;
            margin-bottom: 0.5rem;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .header-section {
                flex-direction: column;
                gap: 1rem;
            }

            .content-box {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="/logos/banner.png" alt="BMGOne" class="logo-img">
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="https://bmgone.com" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="btn btn-staff-login" id="logoutBtn">Logout</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Container -->
    <div class="container">
        <div class="header-section">
            <h1>📋 Leave Approvals</h1>
            <button class="btn-back" onclick="goBack()">← Back to Dashboard</button>
        </div>

        <div class="content-box">
            <div class="icon">⏳</div>
            <h2>Leave Approvals - Coming Soon</h2>
            <p>This feature is currently under development.</p>
            <p style="font-size: 0.875rem; margin-top: 1rem;">You'll be able to review and approve employee leave requests here.</p>
        </div>
    </div>

    <script>
        const CONFIG = {
            API_BASE: 'https://pay.bmgone.com/api'
        };

        let token = localStorage.getItem('token');

        // Check authentication
        window.addEventListener('load', function() {
            if (!token) {
                alert('⚠️ Not authenticated. Please login first.');
                window.location.href = 'index.html';
                return;
            }

            const employee = localStorage.getItem('employee');
            if (employee) {
                try {
                    const employeeData = JSON.parse(employee);
                    if (!employeeData.role || !['admin', 'master_admin'].includes(employeeData.role)) {
                        alert('❌ Access Denied. Only admins can access this page.');
                        window.location.href = 'index.html';
                        return;
                    }
                } catch (e) {
                    alert('❌ Invalid authentication data.');
                    window.location.href = 'index.html';
                    return;
                }
            }
        });

        // Go back to dashboard
        function goBack() {
            window.location.href = 'index.html';
        }

        // Logout button
        document.getElementById('logoutBtn')?.addEventListener('click', async function(e) {
            e.preventDefault();
            try {
                await fetch(`${CONFIG.API_BASE}/auth/logout`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
            } catch (error) {
                console.error('Logout error:', error);
            }

            localStorage.removeItem('token');
            localStorage.removeItem('employee');
            window.location.reload();
        });
    </script>
</body>
</html>
